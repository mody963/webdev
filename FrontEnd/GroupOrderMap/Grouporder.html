<style>
    body {
        /* dit is gewoon zovan ga 1 stap terug zo maak je een in de body kind of comment */

    }

<body >

    <p style="color:rgb(234, 206, 170); text-align:center; font-family: 'Courier New', Courier, monospace;">Order coffee together with other members of the club!</p>

    <hr>

    <h2 style="color:rgb(234, 206, 170);font-family: 'Courier New', Courier, monospace;"> MENU</h>

    <div style="background-color:rgb(234, 206, 170); padding:20px; margin:50px;">

        <h4 style="color:rgb(52, 21, 15);font-family: 'Courier New', Courier, monospace;">opties</h4>
        
        <!-- maak hier iets om ervoor te zorgen dat je naar een volgende pagina toe kan gaan om alle andere grouporders te bekijken, maak het als lijst keuze. -->
        <!-- button maken of iets om de volgende order te kunnen maken hieronder. -->
        <!-- open order kunenn wijzigen door bijvb iets toe te voegen / wijzigen zolang het open staat-->
        <!-- alleen closed orders te kunnen zien. -->
        <!-- Een open order annuleren (alleen starter/committee memeber met juiste permissions)-->

        <h4 style="color:rgb(52, 21, 15);font-family: 'Courier New', Courier, monospace;">All Orders</h4>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Group Order</title>

    <link rel="stylesheet" href="../Stylesheets/Basicstyle.css">
    <link rel="stylesheet" href="OrderSpecificStylesheet.css">
</head>

<body>

    <header>
        <p><a href="GroupOrders.html" class="back-link">&larr; Back to Group Orders</a></p>
        <h1>New Group Order</h1>
    </header>

    <p class="intro">Start a new group order and pick your own coffee to kick it off. Once it's open, other club members can join and add their own items until you close it.</p>

    <hr>

    <div class="card">

        <h4>Order details</h4>

        <div class="form-group">
            <label for="order-name">Order name</label>
            <input type="text" id="order-name" class="form-input" placeholder="e.g. Friday Afternoon Order">
        </div>

        <div class="form-group">
            <label for="order-deadline">Deadline to join</label>
            <input type="datetime-local" id="order-deadline" class="form-input">
        </div>

        <div class="form-group">
            <label for="order-note">Note (optional)</label>
            <textarea id="order-note" class="form-input" rows="3" placeholder="Anything the group should know, e.g. pickup location"></textarea>
        </div>

    </div>

    <hr>



    <!-- dingen die je in het mandje ding kan gooien en kan orderen-->
    
    <h2>MENU</h2>

    

    <hr>
    <div class="coffee-menu" id="coffee-menu">

            <div class="coffee-card" data-coffee-name="Espresso" data-coffee-price="2.20">
                
            </div>
    </div>




    <hr>
    <p class="footer-text">Group Orders &copy; the club</p>



</body>
</html>
